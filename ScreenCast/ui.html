<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http:">
<title>Arsist ScreenCast</title>
<style>
  :root {
    --bg: #15181d; --surface: #1d2128; --surface2: #262b34; --text: #e7e9ee; --muted: #8b93a3;
    --accent: #4f8cff; --ok: #3ccf8e; --warn: #f0b545; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans JP", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--surface); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .grow { flex: 1; }
  main { padding: 16px 20px 28px; display: grid; gap: 16px; }
  section { background: var(--surface); border-radius: 10px; padding: 14px 16px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .04em; }
  .addr { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .addr code { font: 600 26px ui-monospace, monospace; letter-spacing: .02em; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .slots { grid-template-columns: 1fr; } }
  .slot h3 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .preview { width: 100%; aspect-ratio: 16/9; background: #0c0e12; border-radius: 8px; object-fit: contain; display: block; }
  .src { margin: 8px 0; color: var(--muted); min-height: 1.5em; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 0; border-radius: 6px; padding: 7px 10px; min-width: 0; }
  input:focus { outline: 1px solid var(--accent); }
  button { background: var(--surface2); cursor: pointer; padding: 8px 14px; }
  button:hover { filter: brightness(1.2); }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.warn { background: #6a4b16; color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; background: var(--surface2); color: var(--muted); }
  .pill.ok { background: rgba(60, 207, 142, .16); color: var(--ok); }
  .pill.warn { background: rgba(240, 181, 69, .16); color: var(--warn); }
  .pill.err { background: rgba(255, 107, 107, .16); color: var(--err); }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .err { color: var(--err); white-space: pre-wrap; }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .side { grid-template-columns: 1fr; } }
  details summary { cursor: pointer; color: var(--muted); }
  details .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; margin-top: 10px; }
  label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  code.cmd { display: block; background: var(--bg); padding: 6px 8px; border-radius: 6px; font: 12px ui-monospace, monospace; overflow-wrap: anywhere; margin-top: 6px; color: var(--text); }
  /* 選ぶ画面 */
  #picker { position: fixed; inset: 0; background: rgba(8, 10, 14, .82); display: none; padding: 28px; overflow: auto; }
  #picker.on { display: block; }
  #picker .box { background: var(--surface); border-radius: 12px; padding: 16px 18px; max-width: 1100px; margin: 0 auto; }
  #picker .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
  #picker .item { background: var(--surface2); border-radius: 8px; padding: 8px; cursor: pointer; text-align: left; display: grid; gap: 6px; }
  #picker .item:hover { outline: 2px solid var(--accent); }
  #picker .item img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #0c0e12; border-radius: 6px; }
  #picker .item span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Arsist ScreenCast</h1>
  <span id="servePill" class="pill"></span>
  <span class="grow"></span>
  <button id="lang" class="ghost"></button>
</header>
<main>
  <section>
    <h2 data-t="addrTitle"></h2>
    <div class="addr" id="addrs"></div>
    <div class="note" data-t="addrNote"></div>
    <div id="serverError" class="err"></div>
  </section>

  <div class="slots" id="slots"></div>

  <div class="side">
    <section>
      <h2 data-t="connTitle"></h2>
      <div id="conn"></div>
      <div id="fw" style="margin-top:10px"></div>
    </section>
    <section>
      <h2 data-t="control"></h2>
      <div id="controlInfo" class="muted" style="margin-bottom:8px"></div>
      <div class="row">
        <button id="prev" data-t="prev"></button>
        <button id="next" data-t="next"></button>
      </div>
      <div id="controlResult" class="note"></div>
    </section>
  </div>

  <section>
    <details>
      <summary data-t="advanced"></summary>
      <div class="grid">
        <label><span data-t="port"></span><input id="port" type="number" min="1" max="65535"></label>
        <label><span data-t="token"></span><input id="token" type="text" spellcheck="false"></label>
      </div>
      <div class="row" style="margin-top:10px"><button id="applyServer" data-t="applyServer"></button></div>
      <div class="note" data-t="tokenNote"></div>
      <div id="qualityBox"></div>
    </details>
  </section>
</main>

<div id="picker"><div class="box">
  <div class="row"><h2 id="pickerTitle" style="margin:0"></h2><span class="grow"></span><button id="pickerClose" data-t="cancel"></button></div>
  <div id="pickerList" class="list"></div>
</div></div>
<script src="ui.js"></script>
</body>
</html>
